<!DOCTYPE html>
<!--
  Mandalorian: Nevarro Frontier — interactive web client entry (Spec 40 §2).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <title>Mandalorian — Nevarro Frontier</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #140d09;
        color: #f3e4d2;
        font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
      }
      #scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        touch-action: none;
      }
      #loading {
        position: fixed;
        inset: 0;
        z-index: 90;
        display: flex;
        flex-direction: column;
        gap: 14px;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at 50% 35%, #2b1a10 0%, #0d0704 75%);
        transition: opacity 400ms ease;
      }
      #loading.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #loading h1 {
        margin: 0;
        font-size: clamp(18px, 4vw, 30px);
        letter-spacing: 0.36em;
        text-transform: uppercase;
        color: #e69c4c;
        text-shadow: 0 0 24px rgba(230, 156, 76, 0.35);
      }
      #loading .sub {
        font-size: 11px;
        letter-spacing: 0.22em;
        color: rgba(243, 228, 210, 0.55);
      }
      #orientation-guard {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="scene" tabindex="0" aria-label="Mandalorian Nevarro Frontier 3D view"></canvas>
    <div id="loading">
      <h1>Mandalorian // Nevarro</h1>
      <div class="sub">igniting Z-6 jetpack · calibrating Beskar telemetry</div>
    </div>
    <div id="orientation-guard" style="display: none" role="alertdialog" aria-live="assertive" aria-label="Rotate device to landscape"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
